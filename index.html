<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lara's Games</title>
<style>
  :root {
    --bg-deep: #0b0f2e;
    --bg-panel: #141a42;
    --accent: #5ee7ff;
    --accent-warm: #ff9f5e;
    --text-main: #eef1ff;
    --text-dim: #9aa3d1;
    --p1-color: #7cffb2;
    --p2-color: #ff6fae;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 20%, rgba(94,231,255,0.08), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,159,94,0.08), transparent 40%),
      var(--bg-deep);
    color: var(--text-main);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 60px;
  }

  h1 {
    font-size: clamp(2rem, 7vw, 3rem);
    letter-spacing: 0.02em;
    margin: 0 0 6px;
    text-align: center;
    background: linear-gradient(90deg, var(--accent), var(--accent-warm));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 1.05rem;
    margin-bottom: 40px;
    text-align: center;
  }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 18px;
    width: 100%;
    max-width: 720px;
  }

  .game-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-decoration: none;
    color: var(--text-main);
    background: var(--bg-panel);
    border: 1px solid rgba(94,231,255,0.15);
    border-radius: 18px;
    padding: 24px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  a.game-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(94,231,255,0.18);
  }

  a.game-card:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }

  .game-icon {
    font-size: 2.6rem;
    line-height: 1;
    margin-bottom: 14px;
  }

  .game-name {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .game-desc {
    font-size: 0.95rem;
    color: var(--text-dim);
    line-height: 1.4;
  }

  .game-card.soon {
    opacity: 0.55;
    cursor: default;
    border-style: dashed;
  }

  .badge {
    align-self: flex-start;
    margin-top: 14px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 999px;
  }

  .badge-play {
    background: var(--p1-color);
    color: #071022;
  }

  .badge-soon {
    background: #2a3161;
    color: var(--text-dim);
  }

  footer {
    margin-top: 48px;
    color: var(--text-dim);
    font-size: 0.85rem;
    text-align: center;
  }
</style>
</head>
<body>

  <h1>Lara's Games</h1>
  <p class="subtitle">Pick a game to play.</p>

  <div class="games-grid">

    <a class="game-card" href="./memory-game.html">
      <div class="game-icon">🚀</div>
      <div class="game-name">Memory Game</div>
      <div class="game-desc">Match the pairs against the clock, or take turns with a friend. Three difficulty levels.</div>
      <span class="badge badge-play">Play</span>
    </a>

    <div class="game-card soon">
      <div class="game-icon">🎮</div>
      <div class="game-name">Platform Game</div>
      <div class="game-desc">A jump-and-run adventure for two players. In the works.</div>
      <span class="badge badge-soon">Coming soon</span>
    </div>

  </div>

  <footer>More games on the way.</footer>

</body>
</html>
