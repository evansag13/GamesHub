<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Table Football</title>
<style>
  :root { --bg-deep:#0b1a10; --bg-panel:#10251a; --text-main:#eef1ff; --text-dim:#9fc0ab; --pink:#ff5fa8; --sully:#f4f6ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; }
  body { background:var(--bg-deep); color:var(--text-main); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; display:flex; flex-direction:column; }
  .hud { display:flex; align-items:center; justify-content:space-between; padding:9px 18px; background:var(--bg-panel); gap:12px; flex-wrap:wrap; }
  .score { font-size:1rem; font-weight:700; min-width:120px; }
  .score span { font-size:1.5rem; display:block; }
  .score.pink { color:var(--pink); }
  .score.sully { color:var(--sully); text-align:right; }
  .title { font-size:0.8rem; color:var(--text-dim); letter-spacing:0.08em; text-transform:uppercase; }
  .stage { position:relative; flex:1; min-height:0; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  .overlay { position:absolute; inset:0; background:rgba(11,26,16,0.94); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .overlay.hidden { display:none; }
  .overlay h1 { font-size:clamp(1.6rem,5vw,2.4rem); margin:0 0 10px; background:linear-gradient(90deg,var(--pink),var(--sully)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .overlay p { color:var(--text-dim); margin:4px 0; font-size:0.95rem; }
  .controls-note { display:flex; gap:26px; margin:16px 0 22px; flex-wrap:wrap; justify-content:center; }
  .controls-note strong { display:block; font-size:1rem; margin-bottom:4px; }
  .controls-note .pink { color:var(--pink); } .controls-note .sully { color:var(--sully); }
  button { font-family:inherit; border:none; cursor:pointer; background:var(--pink); color:#2a0a19; padding:12px 30px; border-radius:999px; font-weight:700; font-size:1rem; }
  button:hover { transform:translateY(-1px); }
  .winner { font-size:1.5rem; font-weight:700; margin-bottom:10px; }
</style>
</head>
<body>
  <div class="hud">
    <div class="score pink">Sully Pinks<span id="score-pink">0</span></div>
    <div class="title">First to 7</div>
    <div class="score sully">Sully Whites<span id="score-sully">0</span></div>
  </div>
  <div class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="start-overlay">
      <img id="badge-img" alt="Sully Sports FC" style="width:84px;height:84px;margin-bottom:6px;" />
      <h1>Table Football</h1>
      <p>Sully Pinks versus Sully Whites. Slide your rods to block and strike.</p>
      <div class="controls-note">
        <div class="pink"><strong>Sully Pinks</strong>Drag the left side to slide<br>Tap to spin &amp; kick</div>
        <div class="sully"><strong>Sully Whites</strong>Drag the right side to slide<br>Tap to spin &amp; kick</div>
      </div>
      <p>Best in landscape, with a player either side.</p>
      <button id="start-btn">Kick off</button>
    </div>
    <div class="overlay hidden" id="end-overlay">
      <div class="winner" id="winner-text"></div>
      <button id="again-btn">Play again</button>
    </div>
  </div>

  const WIN_SCORE=7;
  const MOVE_SPEED=1.15;     // fraction of play height per second
  const OFFSET_LIMIT=0.15;
  const KICK=560, FRICTION=0.992, WALL_REST=0.9, FIG_REST=0.92;
  const SPIN_DUR=0.3;

  const ROLE_YS={ gk:[0.5], def:[0.34,0.66], mid:[0.25,0.5,0.75], strik:[0.38,0.62] };
  const RODS=[
    { x:0.06, team:'pink',  role:'gk' },
    { x:0.20, team:'pink',  role:'def' },
    { x:0.34, team:'sully', role:'strik' },
    { x:0.44, team:'pink',  role:'mid' },
    { x:0.56, team:'sully', role:'mid' },
    { x:0.66, team:'pink',  role:'strik', lara:0 },
    { x:0.80, team:'sully', role:'def' },
    { x:0.94, team:'sully', role:'gk' }
  ];

  const KIT={ pink:{shirt:'#ff5fa8',shorts:'#ff5fa8',socks:'#ff5fa8'}, sully:{shirt:'#f4f6ff',shorts:'#14161c',socks:'#14161c'} };
  const GKKIT={ pink:{shirt:'#9aa0a8',shorts:'#9aa0a8',socks:'#9aa0a8'}, sully:{shirt:'#ffd21e',shorts:'#ffd21e',socks:'#ffd21e'} };
  const SKIN='#f1c9a5';
  const HAIRS=['#141210','#3a2417','#5c3a1e','#dcb85e'];
  RODS.forEach(rod=>{ const n=ROLE_YS[rod.role].length; rod.hair=[]; for (let i=0;i<n;i++) rod.hair[i]=(rod.lara===i)?'#e8c86a':HAIRS[Math.floor(Math.random()*HAIRS.length)]; });

  let layout=null, ball=null, offsets={pink:0,sully:0}, prevOffsets={pink:0,sully:0}, teamVy={pink:0,sully:0};
  let scores={pink:0,sully:0}, running=false, lastFrame=0, stuckTimer=0, tiltFlash=0;
  const spins={pink:{active:false,t:0,kicked:false}, sully:{active:false,t:0,kicked:false}};
  const keys={}; const kickEdge={pink:false,sully:false};

  function resize(){
    const dpr=window.devicePixelRatio||1;
    const w=stage.clientWidth, h=stage.clientHeight;
    canvas.width=w*dpr; canvas.height=h*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    computeLayout(w,h);
  }
  function computeLayout(w,h){
    const m=Math.max(26,Math.min(w,h)*0.09);
    const left=m, right=w-m, top=m, bottom=h-m;
    const playW=right-left, playH=bottom-top;
    const goalH=playH*0.34;
    const figScale=Math.max(30,Math.min(64,playH*0.14));
    const ballR=Math.max(7,playH*0.02);
    layout={w,h,left,right,top,bottom,playW,playH,goalH,figScale,ballR,goalTop:top+(playH-goalH)/2,goalBot:top+(playH+goalH)/2};
    if (!ball) resetBall(1);
  }
  function px(fx){ return layout.left+fx*layout.playW; }
  function py(fy){ return layout.top+fy*layout.playH; }

  function figures(){
    const list=[];
    for (const rod of RODS){
      const ys=ROLE_YS[rod.role];
      ys.forEach((by,i)=>{
        let fy=by+offsets[rod.team];
        fy=Math.max(0.06,Math.min(0.94,fy));
        list.push({ x:px(rod.x), y:py(fy), team:rod.team, lara:rod.lara===i, hair:rod.hair[i], gk:rod.role==='gk' });
      });
    }
    return list;
  }

  function resetBall(dir){
    stuckTimer=0;
    ball={ x:layout.left+layout.playW/2, y:layout.top+layout.playH/2, vx:(dir||(Math.random()<0.5?1:-1))*180*(0.6+Math.random()*0.4), vy:(Math.random()*2-1)*120, r:layout.ballR };
  }

  function startGame(){
    scores={pink:0,sully:0}; updateScore();
    offsets={pink:0,sully:0}; prevOffsets={pink:0,sully:0};
    resetBall();
    running=true; lastFrame=performance.now();
    document.getElementById('start-overlay').classList.add('hidden');
    document.getElementById('end-overlay').classList.add('hidden');
    requestAnimationFrame(loop);
  }

  function updateScore(){ document.getElementById('score-pink').textContent=scores.pink; document.getElementById('score-sully').textContent=scores.sully; }

  function loop(ts){
    if (!running) return;
    let dt=(ts-lastFrame)/1000; lastFrame=ts; if (dt>0.05) dt=0.05;

    prevOffsets.pink=offsets.pink; prevOffsets.sully=offsets.sully;
    if (keys['w']) offsets.pink-=MOVE_SPEED*dt;
    if (keys['s']) offsets.pink+=MOVE_SPEED*dt;
    if (keys['arrowup']) offsets.sully-=MOVE_SPEED*dt;
    if (keys['arrowdown']) offsets.sully+=MOVE_SPEED*dt;
    offsets.pink=Math.max(-OFFSET_LIMIT,Math.min(OFFSET_LIMIT,offsets.pink));
    offsets.sully=Math.max(-OFFSET_LIMIT,Math.min(OFFSET_LIMIT,offsets.sully));
    teamVy.pink=(offsets.pink-prevOffsets.pink)/dt*layout.playH;
    teamVy.sully=(offsets.sully-prevOffsets.sully)/dt*layout.playH;

    const figs=figures();

    ball.vx*=FRICTION; ball.vy*=FRICTION;
    ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;

    if (ball.y-ball.r<layout.top){ ball.y=layout.top+ball.r; ball.vy=Math.abs(ball.vy)*WALL_REST; }
    if (ball.y+ball.r>layout.bottom){ ball.y=layout.bottom-ball.r; ball.vy=-Math.abs(ball.vy)*WALL_REST; }

    if (ball.x-ball.r<layout.left){
      if (ball.y>layout.goalTop && ball.y<layout.goalBot){ scores.sully++; goal('sully'); return; }
      ball.x=layout.left+ball.r; ball.vx=Math.abs(ball.vx)*WALL_REST;
    }
    if (ball.x+ball.r>layout.right){
      if (ball.y>layout.goalTop && ball.y<layout.goalBot){ scores.pink++; goal('pink'); return; }
      ball.x=layout.right-ball.r; ball.vx=-Math.abs(ball.vx)*WALL_REST;
    }

    const figR=layout.figScale*0.3;
    for (const f of figs){
      const dx=ball.x-f.x, dy=ball.y-f.y; const R=ball.r+figR; const dist=Math.hypot(dx,dy)||0.001;
      if (dist<R){
        const nx=dx/dist, ny=dy/dist;
        ball.x=f.x+nx*R; ball.y=f.y+ny*R;
        const vn=ball.vx*nx+ball.vy*ny;
        if (vn<0){ ball.vx-=(1+FIG_REST)*vn*nx; ball.vy-=(1+FIG_REST)*vn*ny; }
        ball.vy+=teamVy[f.team]*0.25;
      }
    }

    updateSpins(dt,figs,figR);

    if (tiltFlash>0) tiltFlash-=dt;
    const spd=Math.hypot(ball.vx,ball.vy);
    const cornerDist=Math.min(layout.playW,layout.playH)*0.22;
    const corners=[[layout.left,layout.top],[layout.right,layout.top],[layout.left,layout.bottom],[layout.right,layout.bottom]];
    let nearCorner=false; for (const c of corners){ if (Math.hypot(ball.x-c[0],ball.y-c[1])<cornerDist){ nearCorner=true; break; } }
    if (spd<Math.max(20,layout.playH*0.06) && nearCorner){
      stuckTimer+=dt;
      if (stuckTimer>=3){
        const cx=layout.left+layout.playW/2, cy=layout.top+layout.playH/2;
        const ang=Math.atan2(cy-ball.y,cx-ball.x)+(Math.random()*0.6-0.3);
        const sp=Math.max(240,layout.playW*0.45);
        ball.vx=Math.cos(ang)*sp; ball.vy=Math.sin(ang)*sp;
        stuckTimer=0; tiltFlash=1.0;
      }
    } else stuckTimer=0;

    render(figs);

    if (scores.pink>=WIN_SCORE||scores.sully>=WIN_SCORE){ endGame(); return; }
    requestAnimationFrame(loop);
  }

  function startSpin(team){ const sp=spins[team]; if (sp.active) return; sp.active=true; sp.t=0; sp.kicked=false; }
  function updateSpins(dt,figs,figR){
    for (const team of ['pink','sully']){
      const sp=spins[team]; if (!sp.active) continue;
      sp.t+=dt;
      if (!sp.kicked){
        const dir=team==='pink'?1:-1;
        const reach=layout.playW*0.1;
        for (const f of figs){
          if (f.team!==team) continue;
          const ahead = dir>0 ? (ball.x>f.x-figR && ball.x<f.x+reach) : (ball.x<f.x+figR && ball.x>f.x-reach);
          if (ahead && Math.abs(ball.y-f.y)<figR+ball.r+layout.figScale*0.12){
            ball.vx=dir*KICK; ball.vy=(ball.y-f.y)/figR*180+(Math.random()*90-45); sp.kicked=true; break;
          }
        }
      }
      if (sp.t>=SPIN_DUR) sp.active=false;
    }
  }

  function goal(scorer){
    updateScore();
    if (scores.pink>=WIN_SCORE||scores.sully>=WIN_SCORE){ endGame(); return; }
    resetBall(scorer==='pink'?-1:1);
    lastFrame=performance.now();
    requestAnimationFrame(loop);
  }

  function roofCap(x,y,w,h){ rr(x,y,w,h,6); ctx.fill(); ctx.stroke(); }
  function drawStands(L){
    const W=L.w,H=L.h, rad=Math.min(W,H)*0.16, si=Math.min(W,H)*0.03;
    ctx.fillStyle='#dfe3ea'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f4f6fa'; ctx.strokeStyle='#c3c8d2'; ctx.lineWidth=2;
    rr(6,6,W-12,H-12,rad); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#1b2b52';
    rr(6+si,6+si,W-12-2*si,H-12-2*si,Math.max(4,rad-si)); ctx.fill();
    ctx.fillStyle='rgba(120,150,210,0.4)';
    const gap=Math.max(12,Math.min(W,H)*0.022);
    for (let yy=6+si+gap; yy<H-6-si; yy+=gap){
      const off=((Math.round(yy/gap))%2)*(gap/2);
      for (let xx=6+si+gap+off; xx<W-6-si; xx+=gap){
        if (xx>L.left-4 && xx<L.right+4 && yy>L.top-4 && yy<L.bottom+4) continue;
        ctx.beginPath(); ctx.arc(xx,yy,1.6,0,7); ctx.fill();
      }
    }
    ctx.strokeStyle='rgba(255,255,255,0.12)'; ctx.lineWidth=2;
    const pc=[[L.left,L.top],[L.right,L.top],[L.left,L.bottom],[L.right,L.bottom]];
    const rc=[[6+si,6+si],[W-6-si,6+si],[6+si,H-6-si],[W-6-si,H-6-si]];
    for (let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(pc[i][0],pc[i][1]); ctx.lineTo(rc[i][0],rc[i][1]); ctx.stroke(); }
    const pm=[[(L.left+L.right)/2,L.top],[(L.left+L.right)/2,L.bottom],[L.left,(L.top+L.bottom)/2],[L.right,(L.top+L.bottom)/2]];
    const rm=[[W/2,6+si],[W/2,H-6-si],[6+si,H/2],[W-6-si,H/2]];
    for (let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(pm[i][0],pm[i][1]); ctx.lineTo(rm[i][0],rm[i][1]); ctx.stroke(); }
    ctx.fillStyle='#f4f6fa'; ctx.strokeStyle='#c3c8d2'; ctx.lineWidth=2;
    const capW=W*0.16, capH=Math.min(W,H)*0.06;
    roofCap(W/2-capW/2,2,capW,capH); roofCap(W/2-capW/2,H-2-capH,capW,capH);
    const capW2=Math.min(W,H)*0.06, capH2=H*0.16;
    roofCap(2,H/2-capH2/2,capW2,capH2); roofCap(W-2-capW2,H/2-capH2/2,capW2,capH2);
  }
  function render(figs){
    const L=layout;
    ctx.fillStyle='#12141d'; ctx.fillRect(0,0,L.w,L.h);
    drawStands(L);
    ctx.fillStyle='#1f7a3d'; ctx.fillRect(L.left,L.top,L.playW,L.playH);
    ctx.fillStyle='#1c6f38';
    const stripes=10; const sw=L.playW/stripes;
    for (let i=0;i<stripes;i+=2) ctx.fillRect(L.left+i*sw,L.top,sw,L.playH);
    ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=2;
    ctx.strokeRect(L.left,L.top,L.playW,L.playH);
    ctx.beginPath(); ctx.moveTo(L.left+L.playW/2,L.top); ctx.lineTo(L.left+L.playW/2,L.bottom); ctx.stroke();
    ctx.beginPath(); ctx.arc(L.left+L.playW/2,L.top+L.playH/2,L.playH*0.13,0,7); ctx.stroke();
    if (badge.complete && badge.naturalWidth){ const br=Math.min(L.top*0.3,L.w*0.06); const cy=(Math.min(L.w,L.h)*0.06+L.top)/2; ctx.drawImage(badge,L.w/2-br,cy-br,br*2,br*2); }
    ctx.fillStyle='rgba(255,255,255,0.15)';
    ctx.fillRect(L.left-6,L.goalTop,6,L.goalH); ctx.fillRect(L.right,L.goalTop,6,L.goalH);
    ctx.strokeStyle='rgba(255,255,255,0.6)';
    ctx.strokeRect(L.left,L.goalTop-L.playH*0.06,L.playW*0.06,L.goalH+L.playH*0.12);
    ctx.strokeRect(L.right-L.playW*0.06,L.goalTop-L.playH*0.06,L.playW*0.06,L.goalH+L.playH*0.12);

    for (const rod of RODS){ const x=px(rod.x);
      ctx.strokeStyle='#8a8f99'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(x,L.top); ctx.lineTo(x,L.bottom); ctx.stroke();
      ctx.strokeStyle='#d8dce4'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(x-1.5,L.top); ctx.lineTo(x-1.5,L.bottom); ctx.stroke();
    }

    ctx.font='700 13px sans-serif';
    ctx.fillStyle='rgba(255,95,168,0.3)'; ctx.textAlign='left'; ctx.fillText('PINKS',L.left+8,L.top+18);
    ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.textAlign='right'; ctx.fillText('WHITES',L.right-8,L.top+18); ctx.textAlign='start';

    for (const f of figs){ const sp=spins[f.team]; const kp=sp.active?Math.min(1,sp.t/SPIN_DUR):0; drawFigure(f.x,f.y,L.figScale,f.team,f.lara,f.hair,f.gk,(f.team==='pink'?1:-1),kp); }

    ctx.fillStyle='#fff'; ctx.strokeStyle='#111'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#111';
    ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r*0.32,0,7); ctx.fill();
    if (tiltFlash>0){ ctx.save(); ctx.globalAlpha=Math.min(1,tiltFlash*1.6); ctx.fillStyle='#ffd21e'; ctx.font='700 '+Math.round(L.playH*0.1)+'px sans-serif'; ctx.textAlign='center'; ctx.fillText('TILT!',L.left+L.playW/2,L.top+L.playH/2); ctx.restore(); ctx.textAlign='start'; }
  }

  function drawFigure(x,y,s,team,lara,hair,gk,dir,kp){
    const kit=(gk?GKKIT:KIT)[team], dark='#12131a', boot='#191b22';
    ctx.lineJoin='round'; ctx.lineCap='round';
    const swing=Math.sin((kp||0)*Math.PI), hipY=y+s*0.12;
    // back leg (planted)
    ctx.strokeStyle=kit.socks; ctx.lineWidth=Math.max(4,s*0.16);
    ctx.beginPath(); ctx.moveTo(x-dir*s*0.02,hipY); ctx.lineTo(x-dir*s*0.14,hipY+s*0.3); ctx.stroke();
    ctx.fillStyle=boot; ctx.beginPath(); ctx.ellipse(x-dir*s*0.16,hipY+s*0.3,s*0.11,s*0.07,0,0,7); ctx.fill();
    // front leg (kicks toward the goal)
    const ang=dir*(0.4+0.9*swing), legLen=s*0.34;
    const fx=x+dir*s*0.06+Math.sin(ang)*legLen, fy=hipY+Math.cos(ang)*legLen;
    ctx.strokeStyle=kit.socks; ctx.lineWidth=Math.max(4,s*0.16);
    ctx.beginPath(); ctx.moveTo(x+dir*s*0.06,hipY); ctx.lineTo(fx,fy); ctx.stroke();
    ctx.save(); ctx.translate(fx,fy); ctx.rotate(ang); ctx.fillStyle=boot; ctx.beginPath(); ctx.ellipse(dir*s*0.07,0,s*0.12,s*0.075,0,0,7); ctx.fill(); ctx.restore();
    // shorts
    ctx.fillStyle=kit.shorts; ctx.strokeStyle=dark; ctx.lineWidth=Math.max(1.5,s*0.045);
    rr(x-s*0.2,hipY-s*0.08,s*0.4,s*0.2,s*0.08); ctx.fill(); ctx.stroke();
    // torso (chunky body)
    ctx.fillStyle=kit.shirt; ctx.strokeStyle=dark; ctx.lineWidth=Math.max(2,s*0.055);
    rr(x-s*0.2,y-s*0.34,s*0.4,s*0.48,s*0.14); ctx.fill(); ctx.stroke();
    // arm nub toward goal
    ctx.fillStyle=kit.shirt; ctx.strokeStyle=dark; ctx.lineWidth=Math.max(1.5,s*0.04);
    ctx.beginPath(); ctx.ellipse(x+dir*s*0.22,y-s*0.1,s*0.08,s*0.12,0,0,7); ctx.fill(); ctx.stroke();
    // head
    const hx=x+dir*s*0.05, hy=y-s*0.46, hr=s*0.16;
    ctx.fillStyle=SKIN; ctx.strokeStyle=dark; ctx.lineWidth=Math.max(1.5,s*0.045);
    ctx.beginPath(); ctx.arc(hx,hy,hr,0,7); ctx.fill(); ctx.stroke();
    // hair cap
    ctx.fillStyle=hair; ctx.beginPath(); ctx.arc(hx,hy,hr*1.05,Math.PI*0.82,Math.PI*2.18); ctx.closePath(); ctx.fill();
    // eye toward goal
    ctx.fillStyle=dark; ctx.beginPath(); ctx.arc(hx+dir*hr*0.42,hy+hr*0.05,hr*0.16,0,7); ctx.fill();
    // Lara number
    if (lara){ ctx.fillStyle='#2a0a19'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='700 '+Math.round(s*0.19)+'px sans-serif'; ctx.fillText('13',x,y-s*0.04);
      ctx.textBaseline='alphabetic'; ctx.textAlign='start'; }
  }
  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function endGame(){
    running=false; updateScore();
    document.getElementById('winner-text').textContent=(scores.pink>scores.sully?'Sully Pinks':'Sully Whites')+' win!';
    document.getElementById('winner-text').style.color=scores.pink>scores.sully?'var(--pink)':'var(--sully)';
    document.getElementById('end-overlay').classList.remove('hidden');
  }

  window.addEventListener('keydown',e=>{ const k=e.key.toLowerCase(); keys[k]=true; if (['arrowup','arrowdown','arrowleft','arrowright',' ','enter'].includes(k)) e.preventDefault(); if (!e.repeat && running){ if (k===' ') startSpin('pink'); if (k==='enter') startSpin('sully'); } });
  window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });

  const pointers=new Map();
  function localXY(e){ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
  function kickTeam(team){ startSpin(team); }
  canvas.addEventListener('pointerdown',e=>{ if (!running) return; const {x,y}=localXY(e); pointers.set(e.pointerId,{team:x<layout.w/2?'pink':'sully',startY:y,lastY:y,moved:false}); e.preventDefault(); });
  canvas.addEventListener('pointermove',e=>{ const p=pointers.get(e.pointerId); if (!p) return; const {y}=localXY(e); const dy=y-p.lastY; p.lastY=y; if (Math.abs(y-p.startY)>8) p.moved=true; offsets[p.team]=Math.max(-OFFSET_LIMIT,Math.min(OFFSET_LIMIT,offsets[p.team]+dy/layout.playH)); e.preventDefault(); });
  function endPointer(e){ const p=pointers.get(e.pointerId); if (!p) return; if (!p.moved && running) kickTeam(p.team); pointers.delete(e.pointerId); e.preventDefault(); }
  canvas.addEventListener('pointerup',endPointer);
  canvas.addEventListener('pointercancel',endPointer);
  window.addEventListener('resize',()=>{ if (layout) resize(); });
  document.getElementById('start-btn').addEventListener('click',startGame);
  document.getElementById('again-btn').addEventListener('click',startGame);
  resize();
</script>
</body>
