<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tile Rage</title>
<style>
  :root {
    --bg-deep:#0b0f2e; --bg-panel:#141a42; --text-main:#eef1ff; --text-dim:#9aa3d1;
    --hole:#080b22; --p1:#a78bfa; --p2:#ff6fae;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body {
    background:
      radial-gradient(circle at 18% 18%, rgba(167,139,250,0.08), transparent 40%),
      radial-gradient(circle at 82% 78%, rgba(255,111,174,0.08), transparent 40%),
      var(--bg-deep);
    color:var(--text-main); font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:14px 10px 30px;
  }
  h1 { font-size:clamp(1.3rem,4.5vw,1.9rem); margin:0 0 10px; background:linear-gradient(90deg,var(--p1),var(--p2)); -webkit-background-clip:text; background-clip:text; color:transparent; }

  .game { display:flex; gap:clamp(10px,3vw,30px); align-items:center; justify-content:center; }
  .side { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .target-label { font-size:0.66rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); }
  .target { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; padding:8px; background:var(--bg-panel); border-radius:12px; }
  .target .t { width:clamp(14px,3.4vmin,24px); height:clamp(14px,3.4vmin,24px); border-radius:6px; }
  .timer { font-size:1.2rem; font-weight:700; }
  button { font-family:inherit; border:none; cursor:pointer; background:var(--p1); color:#12082a; padding:10px 22px; border-radius:999px; font-weight:700; font-size:0.9rem; }
  button:hover { transform:translateY(-1px); }

  .stack { display:flex; flex-direction:column; gap:clamp(10px,3vw,22px); }
  .panel { display:flex; flex-direction:column; align-items:center; }
  .panel.p2 { transform:rotate(180deg); }
  .panel .name { font-weight:700; margin-bottom:6px; font-size:0.95rem; }
  .panel.p1 .name { color:var(--p1); } .panel.p2 .name { color:var(--p2); }
  .board { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; padding:7px; border-radius:14px; border:3px solid var(--bg-panel); background:var(--bg-panel); }
  .panel.p1 .board { border-color:var(--p1); } .panel.p2 .board { border-color:var(--p2); }
  .cell { width:clamp(30px,8.5vmin,56px); height:clamp(30px,8.5vmin,56px); border-radius:8px; background:var(--hole); }
  .cell.core { box-shadow:inset 0 0 0 2px rgba(255,255,255,0.32); }
  .cell.tile { cursor:pointer; box-shadow:inset 0 -3px 5px rgba(0,0,0,0.22); }
  .score { margin-top:6px; font-size:0.82rem; color:var(--text-dim); }
  .score strong { font-size:1.1rem; }
  .panel.p1 .score strong { color:var(--p1); } .panel.p2 .score strong { color:var(--p2); }

  .overlay { position:fixed; inset:0; background:rgba(11,15,46,0.92); display:none; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:24px; z-index:5; }
  .overlay.show { display:flex; }
  .overlay .msg { font-size:1.6rem; font-weight:700; margin-bottom:6px; }
  .overlay p { color:var(--text-dim); margin:4px 0 18px; max-width:420px; }
</style>
</head>
<body>
  <h1>Tile Rage</h1>

  <div class="game">
    <div class="side">
      <div class="target-label">Match this</div>
      <div class="target" id="target"></div>
      <div class="timer" id="timer">0.0s</div>
      <button id="round-btn">New round</button>
    </div>

    <div class="stack">
      <div class="panel p2">
        <div class="name">Player 2</div>
        <div class="board" id="board-1"></div>
        <div class="score">Wins <strong id="score-1">0</strong></div>
      </div>
      <div class="panel p1">
        <div class="name">Player 1</div>
        <div class="board" id="board-0"></div>
        <div class="score">Wins <strong id="score-0">0</strong></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="msg" id="msg"></div>
    <p id="sub"></p>
    <button id="ov-btn"></button>
  </div>

<script>
  const COLORS = { r:'#e8392f', o:'#ff8c2a', y:'#ffd21e', g:'#2fae5f', b:'#5ec8ff', w:'#eef0f5' };
  const IDS = ['r','o','y','g','b','w'];
  const N = 5;

  let boards, target, active=false, over=false, scores=[0,0], startTime=0, timerHandle=null;

  function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function makePool(){ const p=[]; for (const id of IDS) for (let k=0;k<4;k++) p.push(id); p.push(null); return p; }

  function makeBoard(){
    const flat=shuffle(makePool());
    const grid=[]; let empty={r:0,c:0};
    for (let r=0;r<N;r++){ grid[r]=[]; for (let c=0;c<N;c++){ const v=flat[r*N+c]; grid[r][c]=v; if (v===null) empty={r,c}; } }
    return {grid,empty};
  }

  function makeTarget(){
    const nine=shuffle(makePool().filter(x=>x!==null)).slice(0,9);
    const t=[]; for (let r=0;r<3;r++){ t[r]=[]; for (let c=0;c<3;c++) t[r][c]=nine[r*3+c]; }
    return t;
  }

  function renderTarget(){
    const el=document.getElementById('target'); el.innerHTML='';
    for (let r=0;r<3;r++) for (let c=0;c<3;c++){ const d=document.createElement('div'); d.className='t'; d.style.background=COLORS[target[r][c]]; el.appendChild(d); }
  }

  function renderBoard(bi){
    const el=document.getElementById('board-'+bi); el.innerHTML='';
    const b=boards[bi];
    for (let r=0;r<N;r++) for (let c=0;c<N;c++){
      const cell=document.createElement('div');
      const v=b.grid[r][c];
      cell.className='cell'+(r>=1&&r<=3&&c>=1&&c<=3?' core':'');
      if (v!==null){ cell.classList.add('tile'); cell.style.background=COLORS[v]; }
      cell.addEventListener('click',()=>clickCell(bi,r,c));
      el.appendChild(cell);
    }
  }

  function clickCell(bi,r,c){
    if (!active || over) return;
    const b=boards[bi], e=b.empty;
    if (r===e.r && c===e.c) return;
    if (r===e.r){
      if (c<e.c){ for (let i=e.c;i>c;i--) b.grid[r][i]=b.grid[r][i-1]; }
      else { for (let i=e.c;i<c;i++) b.grid[r][i]=b.grid[r][i+1]; }
      b.grid[r][c]=null; b.empty={r,c};
    } else if (c===e.c){
      if (r<e.r){ for (let i=e.r;i>r;i--) b.grid[i][c]=b.grid[i-1][c]; }
      else { for (let i=e.r;i<r;i++) b.grid[i][c]=b.grid[i+1][c]; }
      b.grid[r][c]=null; b.empty={r,c};
    } else return;
    renderBoard(bi);
    if (matches(b)) win(bi);
  }

  function matches(b){
    for (let r=0;r<3;r++) for (let c=0;c<3;c++){ if (b.grid[r+1][c+1]!==target[r][c]) return false; }
    return true;
  }

  function win(bi){
    over=true; active=false; stopTimer();
    scores[bi]++; document.getElementById('score-'+bi).textContent=scores[bi];
    const el=document.getElementById('overlay');
    document.getElementById('msg').textContent='Player '+(bi+1)+' wins!';
    document.getElementById('msg').style.color=bi===0?'var(--p1)':'var(--p2)';
    document.getElementById('sub').textContent='Matched in '+((performance.now()-startTime)/1000).toFixed(1)+' seconds.';
    document.getElementById('ov-btn').textContent='Next round';
    el.classList.add('show');
  }

  function startTimer(){ startTime=performance.now(); stopTimer(); timerHandle=setInterval(()=>{ document.getElementById('timer').textContent=((performance.now()-startTime)/1000).toFixed(1)+'s'; },100); }
  function stopTimer(){ if (timerHandle) clearInterval(timerHandle); timerHandle=null; }

  function newRound(){
    boards=[makeBoard(),makeBoard()];
    target=makeTarget();
    over=false; active=false;
    renderTarget(); renderBoard(0); renderBoard(1);
    document.getElementById('timer').textContent='0.0s';
    const el=document.getElementById('overlay');
    document.getElementById('msg').textContent='Ready?';
    document.getElementById('msg').style.color='var(--text-main)';
    document.getElementById('sub').textContent='Study the pattern. Press start and race to match your middle 3x3.';
    document.getElementById('ov-btn').textContent='Start';
    el.classList.add('show');
  }

  function begin(){ document.getElementById('overlay').classList.remove('show'); active=true; startTimer(); }

  document.getElementById('ov-btn').addEventListener('click',()=>{ if (over) newRound(); else begin(); });
  document.getElementById('round-btn').addEventListener('click',newRound);

  newRound();
</script>
</body>
</html>
