<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Space Invaders</title>
<style>
  :root { --bg-deep:#05060f; --bg-panel:#0d1024; --text-main:#eef1ff; --text-dim:#9aa3d1; --p1:#5fd06a; --p2:#5ec8ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; }
  body { background:var(--bg-deep); color:var(--text-main); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; display:flex; flex-direction:column; }
  .hud { display:flex; align-items:center; justify-content:space-between; padding:9px 18px; background:var(--bg-panel); gap:12px; flex-wrap:wrap; }
  .stat { font-size:0.95rem; font-weight:700; }
  .stat span { font-size:1.3rem; }
  .stat.score { color:var(--p1); } .stat.wave { color:var(--text-dim); } .stat.lives { color:var(--p2); }
  .stage { position:relative; flex:1; min-height:0; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  .overlay { position:absolute; inset:0; background:rgba(5,6,15,0.94); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .overlay.hidden { display:none; }
  .overlay h1 { font-size:clamp(1.6rem,5vw,2.4rem); margin:0 0 10px; background:linear-gradient(90deg,var(--p1),var(--p2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .overlay p { color:var(--text-dim); margin:4px 0; font-size:0.95rem; max-width:440px; }
  .controls-note { display:flex; gap:26px; margin:14px 0 20px; flex-wrap:wrap; justify-content:center; }
  .controls-note strong { display:block; font-size:1rem; margin-bottom:4px; }
  .controls-note .p1 { color:var(--p1); } .controls-note .p2 { color:var(--p2); }
  .control-choice { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
  button { font-family:inherit; border:none; cursor:pointer; background:var(--p1); color:#07240f; padding:12px 28px; border-radius:999px; font-weight:700; font-size:0.98rem; }
  button:hover { transform:translateY(-1px); }
  .winner { font-size:1.5rem; font-weight:700; margin-bottom:6px; }
  .touch-controls.hidden { display:none; }
  .cluster { position:absolute; bottom:14px; display:grid; grid-template-columns:repeat(2,60px); grid-template-rows:repeat(2,60px); gap:8px; touch-action:none; }
  .cluster.left { left:14px; } .cluster.right { right:14px; }
  .tbtn { width:60px; height:60px; border-radius:14px; border:3px solid #888; background:rgba(255,255,255,0.12); color:#888; font-size:1.3rem; display:flex; align-items:center; justify-content:center; touch-action:none; user-select:none; -webkit-user-select:none; padding:0; }
  .tbtn:active { background:rgba(255,255,255,0.25); }
  .tbtn.fire { grid-column:1 / 3; justify-self:center; }
  .tbtn.left { grid-row:2; grid-column:1; } .tbtn.right { grid-row:2; grid-column:2; }
</style>
</head>
<body>
  <div class="hud">
    <div class="stat score">Score <span id="score">0</span></div>
    <div class="stat wave">Wave <span id="wave">1</span></div>
    <div class="stat lives">Lives <span id="lives">3</span></div>
  </div>
  <div class="stage">
    <canvas id="game"></canvas>
    <div class="touch-controls hidden" id="touch-controls">
      <div class="cluster left" id="cluster-p1">
        <button class="tbtn fire" data-p="1" data-a="fire">&#9650;</button>
        <button class="tbtn left" data-p="1" data-a="left">&#9664;</button>
        <button class="tbtn right" data-p="1" data-a="right">&#9654;</button>
      </div>
      <div class="cluster right" id="cluster-p2">
        <button class="tbtn fire" data-p="2" data-a="fire">&#9650;</button>
        <button class="tbtn left" data-p="2" data-a="left">&#9664;</button>
        <button class="tbtn right" data-p="2" data-a="right">&#9654;</button>
      </div>
    </div>
    <div class="overlay" id="start-overlay">
      <h1>Space Invaders</h1>
      <p>Two players, one team. Blast the aliens before they land. Shoot the flying saucer for bonus points.</p>
      <div class="controls-note">
        <div class="p1"><strong>Player 1</strong>A / D to move<br>W to fire</div>
        <div class="p2"><strong>Player 2</strong>&larr; / &rarr; to move<br>&uarr; to fire</div>
      </div>
      <button id="start-btn">Choose controls</button>
    </div>
    <div class="overlay hidden" id="control-overlay">
      <h1>How are you playing?</h1>
      <div class="control-choice">
        <button id="pc-btn">Computer &mdash; keyboard</button>
        <button id="tablet-btn">Tablet &mdash; touch</button>
      </div>
    </div>
    <div class="overlay hidden" id="end-overlay">
      <div class="winner" id="winner-text">Game over</div>
      <p id="final-score"></p>
      <button id="again-btn" style="margin-top:16px;">Play again</button>
    </div>
  </div>

<script>
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  const stage=canvas.parentElement;

  const COLS=8, ROWS=5, FIRE_CD=0.34;
  const ROW_COLORS=['#ff6fae','#ffd21e','#5fd06a','#5ec8ff','#b58cff'];
  const ROW_POINTS=[30,20,20,10,10];

  let layout=null, players=[], enemies=[], bullets=[], bombs=[], saucer=null, stars=[];
  let formX=0, formY=0, formVx=1, score=0, lives=3, wave=1, running=false, lastFrame=0;
  let bombTimer=0, saucerTimer=0;
  let controlMode='pc';
  const keys={};

  function resize(){
    const dpr=window.devicePixelRatio||1;
    const w=stage.clientWidth, h=stage.clientHeight;
    canvas.width=w*dpr; canvas.height=h*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    computeLayout(w,h);
  }
  function computeLayout(w,h){
    const cell=Math.min(w/12,h/11);
    layout={ w,h,cell, ew:cell*0.72, colSpacing:cell*1.15, rowSpacing:cell*1.0,
      baseLeft:(w-(COLS-1)*cell*1.15)/2, marginTop:h*0.12, playerY:h-h*0.06,
      playerW:cell*1.0, shipSpeed:w*0.55, bulletSpeed:h*0.9, bombSpeed:h*0.4 };
    if (!stars.length){ for (let i=0;i<70;i++) stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+0.4}); }
  }

  function makeEnemies(){
    enemies=[];
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) enemies.push({r,c,alive:true});
    formX=0; formY=0; formVx=1;
  }
  function enemyPos(e){ return { x:layout.baseLeft+e.c*layout.colSpacing+formX, y:layout.marginTop+e.r*layout.rowSpacing+formY }; }

  function makePlayers(){
    players=[
      { team:0,color:'#5fd06a',x:layout.w*0.4,cd:0,invuln:0 },
      { team:1,color:'#5ec8ff',x:layout.w*0.6,cd:0,invuln:0 }
    ];
  }

  function startGame(){
    resize();
    score=0; lives=3; wave=1;
    makeEnemies(); makePlayers();
    bullets=[]; bombs=[]; saucer=null; bombTimer=1.2; saucerTimer=8;
    running=true; lastFrame=performance.now();
    document.getElementById('control-overlay').classList.add('hidden');
    document.getElementById('end-overlay').classList.add('hidden');
    document.getElementById('touch-controls').classList.toggle('hidden',controlMode!=='tablet');
    updateHud();
    requestAnimationFrame(loop);
  }

  function fire(team){
    const p=players[team]; if (!p || p.cd>0) return;
    bullets.push({ x:p.x, y:layout.playerY-layout.cell*0.6, team });
    p.cd=FIRE_CD;
  }

  function loop(ts){
    if (!running) return;
    let dt=(ts-lastFrame)/1000; lastFrame=ts; if (dt>0.05) dt=0.05;

    // players
    for (const p of players){
      if (p.cd>0) p.cd-=dt; if (p.invuln>0) p.invuln-=dt;
      const left = p.team===0?keys['a']:keys['arrowleft'];
      const right = p.team===0?keys['d']:keys['arrowright'];
      if (left) p.x-=layout.shipSpeed*dt;
      if (right) p.x+=layout.shipSpeed*dt;
      p.x=Math.max(layout.playerW*0.5,Math.min(layout.w-layout.playerW*0.5,p.x));
    }

    // formation move
    const alive=enemies.filter(e=>e.alive);
    const speedMul=1+(1-alive.length/(COLS*ROWS))*1.6 + (wave-1)*0.25;
    formX+=formVx*layout.cell*0.5*speedMul*dt;
    let minx=1e9,maxx=-1e9,maxy=-1e9;
    for (const e of alive){ const p=enemyPos(e); minx=Math.min(minx,p.x); maxx=Math.max(maxx,p.x); maxy=Math.max(maxy,p.y); }
    if (maxx+layout.ew*0.5>layout.w-layout.cell*0.4 && formVx>0){ formVx=-1; formY+=layout.rowSpacing*0.6; }
    else if (minx-layout.ew*0.5<layout.cell*0.4 && formVx<0){ formVx=1; formY+=layout.rowSpacing*0.6; }
    if (maxy>layout.playerY-layout.cell){ endGame(false); return; }

    // bombs
    bombTimer-=dt;
    if (bombTimer<=0 && alive.length){ const e=alive[Math.floor(Math.random()*alive.length)]; const p=enemyPos(e); bombs.push({x:p.x,y:p.y}); bombTimer=Math.max(0.4,1.3-wave*0.1); }
    for (const b of bombs) b.y+=layout.bombSpeed*dt;
    bombs=bombs.filter(b=>b.y<layout.h+20);

    // saucer
    saucerTimer-=dt;
    if (!saucer && saucerTimer<=0){ const dir=Math.random()<0.5?1:-1; saucer={x:dir>0?-30:layout.w+30,dir,y:layout.marginTop*0.5,points:[50,100,150][Math.floor(Math.random()*3)]}; saucerTimer=10+Math.random()*6; }
    if (saucer){ saucer.x+=saucer.dir*layout.w*0.35*dt; if (saucer.x<-40||saucer.x>layout.w+40) saucer=null; }

    // bullets
    for (const bu of bullets) bu.y-=layout.bulletSpeed*dt;
    bullets=bullets.filter(bu=>bu.y>-10);
    for (const bu of bullets){
      if (saucer && Math.abs(bu.x-saucer.x)<layout.cell*0.8 && Math.abs(bu.y-saucer.y)<layout.cell*0.6){ score+=saucer.points; saucer=null; bu.dead=true; updateHud(); continue; }
      for (const e of alive){ const p=enemyPos(e); if (Math.abs(bu.x-p.x)<layout.ew*0.55 && Math.abs(bu.y-p.y)<layout.ew*0.55){ e.alive=false; bu.dead=true; score+=ROW_POINTS[e.r]; updateHud(); break; } }
    }
    bullets=bullets.filter(bu=>!bu.dead);

    // bomb vs players
    for (const b of bombs){
      for (const p of players){
        if (p.invuln>0) continue;
        if (Math.abs(b.x-p.x)<layout.playerW*0.5 && Math.abs(b.y-layout.playerY)<layout.cell*0.6){ b.dead=true; lives--; p.invuln=1.6; updateHud(); if (lives<=0){ endGame(false); return; } }
      }
    }
    bombs=bombs.filter(b=>!b.dead);

    if (alive.length===0){ wave++; makeEnemies(); bullets=[]; bombs=[]; updateHud(); }

    render();
    requestAnimationFrame(loop);
  }

  function updateHud(){ document.getElementById('score').textContent=score; document.getElementById('wave').textContent=wave; document.getElementById('lives').textContent=Math.max(0,lives); }

  function render(){
    const L=layout;
    ctx.fillStyle='#05060f'; ctx.fillRect(0,0,L.w,L.h);
    ctx.fillStyle='rgba(255,255,255,0.5)';
    for (const s of stars){ ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill(); }

    for (const e of enemies){ if (!e.alive) continue; const p=enemyPos(e); drawAlien(p.x,p.y,L.ew,ROW_COLORS[e.r]); }
    if (saucer) drawSaucer(saucer.x,saucer.y,L.cell);
    ctx.fillStyle='#fff';
    for (const bu of bullets){ ctx.fillStyle=players[bu.team].color; ctx.fillRect(bu.x-2,bu.y-L.cell*0.4,4,L.cell*0.4); }
    ctx.fillStyle='#ff5252';
    for (const b of bombs){ ctx.beginPath(); ctx.arc(b.x,b.y,4,0,7); ctx.fill(); }
    for (const p of players){ if (p.invuln>0 && Math.floor(p.invuln*10)%2===0) continue; drawShip(p.x,L.playerY,L.playerW,p.color); }
  }

  function drawAlien(x,y,s,color){
    ctx.fillStyle=color; ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=2;
    rr(x-s*0.5,y-s*0.4,s,s*0.8,6); ctx.fill();
    ctx.fillStyle='#0b0b16';
    ctx.beginPath(); ctx.arc(x-s*0.18,y-s*0.05,s*0.11,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(x+s*0.18,y-s*0.05,s*0.11,0,7); ctx.fill();
    ctx.fillStyle=color;
    ctx.fillRect(x-s*0.5,y+s*0.3,s*0.16,s*0.18);
    ctx.fillRect(x+s*0.34,y+s*0.3,s*0.16,s*0.18);
  }
  function drawSaucer(x,y,s){
    ctx.fillStyle='#ff5fd0'; ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(x,y,s*0.7,s*0.3,0,0,7); ctx.fill();
    ctx.fillStyle='#ffd2f4'; ctx.beginPath(); ctx.ellipse(x,y-s*0.12,s*0.32,s*0.22,0,0,7); ctx.fill();
  }
  function drawShip(x,y,w,color){
    ctx.fillStyle=color; ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x,y-w*0.55); ctx.lineTo(x-w*0.5,y+w*0.3); ctx.lineTo(x+w*0.5,y+w*0.3); ctx.closePath(); ctx.fill();
    ctx.fillRect(x-w*0.09,y-w*0.75,w*0.18,w*0.3);
  }

  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function endGame(){
    running=false;
    document.getElementById('final-score').textContent='Team score: '+score+'  ·  Reached wave '+wave;
    document.getElementById('touch-controls').classList.add('hidden');
    document.getElementById('end-overlay').classList.remove('hidden');
  }

  window.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase(); keys[k]=true;
    if (['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k)) e.preventDefault();
    if (e.repeat || !running) return;
    if (k==='w'||k===' ') fire(0);
    if (k==='arrowup') fire(1);
  });
  window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });

  function btnKey(p,a){ if (a==='left') return p===1?'a':'arrowleft'; if (a==='right') return p===1?'d':'arrowright'; return null; }
  document.querySelectorAll('.tbtn').forEach(btn=>{
    const p=+btn.dataset.p, a=btn.dataset.a, k=btnKey(p,a);
    if (a==='fire'){ btn.addEventListener('pointerdown',e=>{ e.preventDefault(); if (running) fire(p-1); }); }
    else {
      btn.addEventListener('pointerdown',e=>{ e.preventDefault(); keys[k]=true; });
      const up=e=>{ e.preventDefault(); keys[k]=false; };
      btn.addEventListener('pointerup',up); btn.addEventListener('pointercancel',up); btn.addEventListener('pointerleave',up);
    }
  });

  document.getElementById('start-btn').addEventListener('click',()=>{ document.getElementById('start-overlay').classList.add('hidden'); document.getElementById('control-overlay').classList.remove('hidden'); });
  document.getElementById('pc-btn').addEventListener('click',()=>{ controlMode='pc'; startGame(); });
  document.getElementById('tablet-btn').addEventListener('click',()=>{ controlMode='tablet'; startGame(); });
  document.getElementById('again-btn').addEventListener('click',()=>{ document.getElementById('end-overlay').classList.add('hidden'); document.getElementById('control-overlay').classList.remove('hidden'); });
  window.addEventListener('resize',()=>{ if (layout) resize(); });
  resize();
</script>
</body>
</html>
